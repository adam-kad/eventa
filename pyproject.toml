[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eventa"
version = "0.1.0"
description = "Lightweight, local-first event analytics SDK for Python applications"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Adam Kad" }]
dependencies = ["sqlalchemy>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.10"]

[tool.hatch.build.targets.wheel]
packages = ["src/eventa"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["eventa"]
mypy_path = "src"
